<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold-elegant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E596" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B7322" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo oscuro elegante -->
  <rect width="512" height="512" rx="120" fill="#0A0A0A" />
  
  <!-- Borde dorado sutil -->
  <rect width="472" height="472" x="20" y="20" rx="100" fill="none" stroke="url(#gold-elegant)" stroke-width="12" opacity="0.8" />
  
  <!-- Iniciales AO -->
  <text 
    x="50%" y="54%" 
    font-family="'Playfair Display', 'Didot', 'Georgia', serif" 
    font-size="240" 
    font-weight="900" 
    fill="url(#gold-elegant)" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    letter-spacing="-15"
    filter="url(#glow)">
    AO
  </text>
</svg>